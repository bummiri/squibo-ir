<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>SQUIBO</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#141009;color:#F3EBDC;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,138,10,.62) 0%,rgba(0,0,0,0) 46%),
             linear-gradient(205deg,rgba(240,110,30,.50) 0%,rgba(0,0,0,0) 40%),
             linear-gradient(330deg,rgba(255,160,40,.42) 0%,rgba(0,0,0,0) 44%)}
.card{position:relative;z-index:1;width:100%;max-width:360px;
  background:rgba(8,6,3,.42);border:1px solid rgba(255,236,206,.20);
  border-radius:20px;padding:28px 24px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.03em}
.sub{margin:0 0 20px;font-size:13px;color:#C6BAA6}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#BEB09A;margin:0 0 7px}
input{width:100%;padding:12px 13px;font-size:16px;font-family:inherit;
  border:1px solid #4C3F2A;border-radius:11px;background:#221B11;color:#F3EBDC}
input:focus-visible{outline:2px solid #FFA12E;outline-offset:1px}
button{width:100%;margin-top:11px;padding:12px;font-size:15px;font-weight:700;font-family:inherit;
  border:0;border-radius:11px;background:#FFA12E;color:#1A1206;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{min-height:19px;margin-top:11px;font-size:13px;color:#C6BAA6}
.msg.err{color:#FF8E6E;font-weight:600}
@media (prefers-reduced-transparency:reduce){.card{background:#221B11;-webkit-backdrop-filter:none;backdrop-filter:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:#221B11}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<form class="card" id="f">
  <h1>스퀴보 런칭 운영판</h1>
  <p class="sub">비밀번호를 받으신 분만 열 수 있습니다.</p>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" inputmode="text">
  <button id="go" type="submit">열기</button>
  <p class="msg" id="msg" role="status"></p>
</form>
<script>(function(){
var SALT="nVOFBXeoMo/l37W+PcV5Gg==",IV="8DkEwLTykSpXzJiD",IT=600000,SRC="d.txt?v=1091f6079a";
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var f=document.getElementById('f'),pw=document.getElementById('pw'),
    go=document.getElementById('go'),msg=document.getElementById('msg');
function say(t,c){msg.textContent=t;msg.className='msg'+(c?' '+c:'')}
/* 암호문은 입구가 뜨자마자 뒤에서 받아 둔다. 비밀번호를 치는 동안 끝난다 */
var data=fetch(SRC).then(function(r){
  if(!r.ok) throw 0; return r.text();
});
data.catch(function(){say('자료를 받지 못했습니다. 새로고침해 주세요.','err')});
f.addEventListener('submit',function(e){e.preventDefault();
  var v=pw.value.trim();
  if(!v){say('비밀번호를 입력해 주세요.','err');pw.focus();return}
  if(!(window.crypto&&crypto.subtle)){say('이 브라우저에서는 열 수 없습니다. 최신 브라우저로 다시 열어 주세요.','err');return}
  go.disabled=true;pw.disabled=true;say('여는 중입니다. 몇 초 걸립니다.');
  data.then(function(ct){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:IT,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},k,b2u(ct.trim()))})
  })
  .then(function(buf){
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  })
  .catch(function(){go.disabled=false;pw.disabled=false;pw.value='';
    say('비밀번호가 맞지 않습니다.','err');pw.focus()});
});
pw.addEventListener('input',function(){if(msg.classList.contains('err'))say('')});
})();</script>
</body>
</html>
