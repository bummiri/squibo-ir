<style>
:root{--paper:#FFFFFF;--ink:#141210;--sub:#55504A;--muted:#8A847D;--or:#F08300;--or-deep:#C96600;
  --line:#E9E4DE;--soft:#FAF8F5;--no:#B42318;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.72;word-break:keep-all;font-size:16px;-webkit-font-smoothing:antialiased}
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding-block:48px;
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
#gate .box{width:100%;max-width:400px}
#gate .zig{display:block;width:124px;height:auto;margin:0 0 26px}
#gate .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--or-deep)}
#gate h1{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.3;margin:10px 0;text-wrap:balance}
#gate .d{font-size:14.5px;color:var(--sub);margin:0 0 26px}
#gate label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
#gate .row{display:flex;gap:8px}
#gate input{flex:1;min-width:0;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.14em;
  padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink)}
#gate input:focus{outline:2px solid var(--or);outline-offset:1px;border-color:var(--or);background:#fff}
#gate button{font:inherit;font-weight:700;font-size:15px;padding:13px 21px;border:0;border-radius:11px;
  background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}
#gate button:hover{background:var(--or-deep)}
#gate button:disabled{opacity:.55;cursor:default}
#gate button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#gate .msg{font-size:13px;margin-top:13px;min-height:1.3em}
#gate .msg.err{color:var(--no);font-weight:700}
#gate .msg.busy{color:var(--muted)}
#gate .fine{font-size:12px;color:var(--muted);line-height:1.6;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
@media(prefers-reduced-motion:no-preference){
  #gate .box{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
</style>
</head>

<h1>비밀번호가 필요한 문서입니다</h1>

<script>function initPage(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pbar=document.getElementById('pbar');
  function onScroll(){
    var h=document.documentElement, p=h.scrollTop/(h.scrollHeight-h.clientHeight);
    pbar.style.width=(p*100)+'%';
    var ids=['s1','s2','s3','s4','s5','s6','s7','s8','s9'], cur=0;
    for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]); if(el && el.getBoundingClientRect().top < innerHeight*0.4) cur=i;}
    document.querySelectorAll('#dots a').forEach(function(d,i){d.classList.toggle('on',i===cur);});
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  if(!('IntersectionObserver' in window) || reduce){
    document.querySelectorAll('.rv').forEach(function(e){e.classList.add('on');});
  }else{
    var io=new IntersectionObserver(function(es){es.forEach(function(en){ if(en.isIntersecting){en.target.classList.add('on'); io.unobserve(en.target);} });},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.rv').forEach(function(e){io.observe(e);});
  }
}</script>

function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),
    msg=document.getElementById('msg'),gate=document.getElementById('gate'),app=document.getElementById('app');
function say(t,c){msg.textContent=t;msg.className='msg'+(c?' '+c:'')}
f.addEventListener('submit',function(e){e.preventDefault();
  var v=pw.value.trim();
  if(!v){say('비밀번호를 입력해 주세요.','err');pw.focus();return}
  if(!(window.crypto&&crypto.subtle)){say('이 브라우저에서는 열 수 없습니다. 최신 브라우저로 다시 시도해 주세요.','err');return}

  setTimeout(function(){
    crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:IT,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},k,b2u(CT))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);gate.remove();
      try{initPage()}catch(err){document.querySelectorAll('.rv').forEach(function(e){e.classList.add('on')})}
      window.scrollTo(0,0)})
    .catch(function(){go.disabled=false;pw.disabled=false;pw.value='';say('비밀번호가 맞지 않습니다.','err');pw.focus()});
  },30)});
