:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --ink:#1C1914;            /* 검정 80 */
  --ink-2:#4A443B;          /* 유리 위 보조 */
  --glass-ink:#5F5648;
  --accent:#F08300;         /* 오렌지 20. 표식과 빛에만 */
  --accent-ink:#8A4B00;
  --risk:#B4301F;
  --glass-border:rgba(126,94,52,.20);
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:180ms;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
  min-height:100dvh;overflow:hidden}

/* 빛. 화면에 고정, 원 없음, 움직이지 않음. 모서리에서만 번진다 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(135deg,rgba(240,131,0,.30) 0%,rgba(240,131,0,0) 34%),
    linear-gradient(315deg,rgba(255,168,64,.34) 0%,rgba(255,168,64,0) 38%),
    linear-gradient(225deg,rgba(255,186,92,.16) 0%,rgba(255,186,92,0) 30%),
    #FFFFFF}

/* 유리 카드. 뷰포트 가운데에 못 박는다 */
.card{position:fixed;inset:0;margin:auto;height:fit-content;z-index:1;
  width:min(360px,calc(100% - 32px));
  padding:34px 26px 24px;border-radius:26px;text-align:center;isolation:isolate;
  background:linear-gradient(143deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.46) 40%,rgba(255,250,242,.38) 70%,rgba(255,236,210,.42) 100%);
  border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,1),
    inset 1.5px 0 0 rgba(255,255,255,.7),
    inset 0 -1.5px 0 rgba(160,96,20,.14),
    0 30px 70px -32px rgba(120,70,10,.38),
    0 6px 18px -10px rgba(60,40,16,.16)}
/* 카드 안쪽 오렌지 빛. 위 오른쪽 모서리에서만 번지고 글자 자리는 비운다 */
.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(215deg,rgba(240,131,0,.20) 0%,rgba(240,131,0,0) 42%),
    linear-gradient(35deg,rgba(255,180,90,.14) 0%,rgba(255,180,90,0) 36%)}

.logo{display:block;width:132px;height:auto;margin:0 auto}
.title{margin:18px 0 0;font-size:17px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.say{margin:6px 0 0;font-size:13px;line-height:1.6;letter-spacing:-.02em;color:var(--ink-2);white-space:nowrap}

form{margin:22px 0 0;display:flex;flex-direction:column;gap:9px}
input,button{height:48px;border-radius:999px;font-family:inherit;font-size:15px;
  transition:box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease),filter var(--dur) var(--ease),border-color var(--dur) var(--ease)}
input{width:100%;padding:0 18px;text-align:center;color:var(--ink);letter-spacing:.02em;outline:0;
  border:1px solid rgba(126,94,52,.18);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.70));
  box-shadow:inset 0 1px 0 #fff,inset 0 8px 16px -12px rgba(122,82,40,.16)}
input::placeholder{color:var(--glass-ink);letter-spacing:-.02em}
input:focus-visible{border-color:var(--accent);box-shadow:inset 0 1px 0 #fff,0 0 0 3.5px rgba(240,131,0,.24)}
input[aria-invalid="true"]{border-color:var(--risk)}

button{width:100%;border:0;cursor:pointer;color:#FFFFFF;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  background:linear-gradient(180deg,rgba(44,38,30,.92),rgba(24,20,15,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.4),0 10px 22px -12px rgba(30,20,8,.5)}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default;filter:none;opacity:.6}
button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}

.msg{min-height:20px;margin:12px 0 0;font-size:13px;letter-spacing:-.02em;color:var(--glass-ink);white-space:nowrap}
.msg.err{color:var(--risk);font-weight:700}
.foot{margin:16px 0 0;padding-top:14px;border-top:1px solid rgba(126,94,52,.14);
  font-size:11.5px;letter-spacing:-.01em;color:var(--glass-ink);white-space:nowrap}

/* 대비책 셋 */
@media (prefers-reduced-transparency:reduce){
  .card{background:#FFFDF8;-webkit-backdrop-filter:none;backdrop-filter:none}
  .card::before{display:none}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  button:active{transform:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background:#FFFDF8}}
@media (max-width:340px){
  .card{padding:30px 18px 20px}
  .say{font-size:12.5px}}
</style>
</head>

  <h1 class="title">촬영 브리프</h1>
  <p class="say">전달받은 비밀번호를 입력해 주세요.</p>
  <form id="f" novalidate>
    <label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">비밀번호</label>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-describedby="msg">
    <button id="go" type="submit"><span class="dot" aria-hidden="true"></span>브리프 열기</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">작가님께만 전달되는 내부 자료입니다.</p>
</main>
<script>(function(){
var SALT="DJH8DCxQWAaULx2CcVdhjg==",IV="YWS2NEw2Bg7+a9VU",IT=600000,SRC="d.bin?v=4299099292";
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var f=document.getElementById('f'),pw=document.getElementById('pw'),
    go=document.getElementById('go'),msg=document.getElementById('msg');
function say(t,c){msg.textContent=t;msg.className='msg'+(c?' '+c:'');pw.setAttribute('aria-invalid',c==='err'?'true':'false')}
var data=fetch(SRC).then(function(r){if(!r.ok) throw 0; return r.arrayBuffer();});
data.catch(function(){say('자료를 받지 못했습니다. 새로고침해 주세요.','err')});
f.addEventListener('submit',function(e){e.preventDefault();
  var v=pw.value.trim();
  if(!v){say('비밀번호를 입력해 주세요.','err');pw.focus();return}
  if(!(window.crypto&&crypto.subtle)){say('최신 브라우저로 다시 열어 주세요.','err');return}
  go.disabled=true;pw.disabled=true;say('여는 중입니다. 몇 초 걸립니다.');
  data.then(function(ct){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:IT,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},k,ct)})
  })
  .then(function(buf){var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close();})
  .catch(function(){go.disabled=false;pw.disabled=false;pw.value='';
    say('비밀번호가 맞지 않습니다.','err');pw.focus()});
});
pw.addEventListener('input',function(){if(msg.classList.contains('err'))say('')});
})();</script>
